name: Sync Steadfast Status

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steadfast-status-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync active Steadfast shipments
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repository secret is not configured."
            exit 1
          fi

          curl             --fail-with-body             --silent             --show-error             --retry 2             --retry-delay 10             --max-time 60             -H "Authorization: Bearer $CRON_SECRET"             "https://www.gameongarb.com/api/cron/steadfast-status"
